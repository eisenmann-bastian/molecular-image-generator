[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-image-generator"
version = "0.1.0"
description = "Generate molecular 2D images from structures and identifiers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2024.9",
    "molecular-selector @ git+https://github.com/eisenmann-bastian/molecule-selector.git",
    "molecular-utilities @ git+https://github.com/eisenmann-bastian/molecular-utilities.git",
    "sdf-downloader @ git+https://github.com/eisenmann-bastian/sdf-downloader.git",
]

[project.scripts]
molecular-image-generator = "molecular_image_generator.cli:main"

[tool.setuptools.packages.find]
include = ["molecular_image_generator*"]
